[project]
name = "secscan"
version = "0.1.0"
description = "Security-review local checkouts and GitHub repositories (GitHub App or PAT) with an autonomous coding agent (Claude Code, Codex CLI, Kimi CLI, CodeScanAI), emit High/Critical findings as CSV, and optionally open pull requests with fixes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "PyGithub>=2.3",
    "pydantic>=2.6",
    "typer>=0.12",
    "tenacity>=8.2",
    "requests>=2.31",
]

[project.optional-dependencies]
mysql = ["mysqlclient>=2.2"]

[project.scripts]
secscan = "secscan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secscan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
