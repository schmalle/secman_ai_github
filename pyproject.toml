[project]
name = "secscan"
version = "0.1.0"
description = "Scan all reachable GitHub repositories via a GitHub App and run autonomous Claude Code security reviews, emitting High/Critical findings as CSV per repository."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "PyGithub>=2.3",
    "pydantic>=2.6",
    "typer>=0.12",
    "tenacity>=8.2",
]

[project.scripts]
secscan = "secscan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secscan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
